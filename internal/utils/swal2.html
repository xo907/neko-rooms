<html>
<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{.Title}}</title>
{{if .Favicon}}<link rel="icon" href="{{.Favicon}}">{{end}}
{{if .FontURL}}<link rel="stylesheet" href="{{.FontURL}}">{{end}}

<style>
:root {
  --bg: {{.BackgroundColor}};
  --popup: {{.PopupColor}};
  --text: {{.TextColor}};
  --accent: {{.ButtonColor}};
  --line: color-mix(in srgb, var(--text) 9%, transparent);
  --muted: color-mix(in srgb, var(--text) 58%, var(--bg));
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: {{.FontFamily}};
  color: var(--text);
  background-color: var(--bg);
  {{if .BackgroundImage}}background-image: url("{{.BackgroundImage}}");
  background-size: cover;
  background-position: center;{{else}}background-image:
    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
    radial-gradient(40% 40% at 85% 100%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);{{end}}
  display: flex;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.swal2-popup {
  display: flex;
  position: relative;
  z-index: 1;
  flex-direction: column;
  justify-content: center;
  width: 26em;
  max-width: 100%;
  padding: 2.25em 2em 2em;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: color-mix(in srgb, var(--popup) 82%, transparent);
  backdrop-filter: blur(18px);
  box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .04);
  font-size: 15px;
  animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.swal2-header {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.swal2-icon {
  display: flex;
  position: relative;
  box-sizing: content-box;
  justify-content: center;
  align-items: center;
  width: 3.25em;
  height: 3.25em;
  margin: 0 auto 1.25em;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: color-mix(in srgb, currentColor 10%, transparent);
  font-family: inherit;
  cursor: default;
  user-select: none;
}
.swal2-icon.swal2-error { color: #f87171; }
.swal2-icon.swal2-warning { color: #fbbf24; }
.swal2-icon.swal2-info { color: var(--accent); }
.swal2-icon.swal2-question { color: var(--muted); }
.swal2-icon .swal2-icon-content {
  display: flex;
  align-items: center;
  font-size: 1.35em;
  font-weight: 600;
}

/* success: a calm check mark instead of the animated sweetalert one */
.swal2-icon.swal2-success { color: #4ade80; }
.swal2-icon.swal2-success [class^=swal2-success-circular-line],
.swal2-icon.swal2-success .swal2-success-fix,
.swal2-icon.swal2-success .swal2-success-ring { display: none; }
.swal2-icon.swal2-success [class^=swal2-success-line] {
  display: block;
  position: absolute;
  height: 2px;
  border-radius: 2px;
  background-color: currentColor;
}
.swal2-icon.swal2-success [class^=swal2-success-line][class$=tip] {
  top: 1.85em;
  left: .95em;
  width: .7em;
  transform: rotate(45deg);
}
.swal2-icon.swal2-success [class^=swal2-success-line][class$=long] {
  top: 1.6em;
  right: .8em;
  width: 1.3em;
  transform: rotate(-45deg);
}
.swal2-title {
  margin: 0 0 .5em;
  padding: 0;
  color: var(--text);
  font-size: 1.45em;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-align: center;
  word-wrap: break-word;
}
.swal2-content {
  margin: 0;
  color: var(--muted);
  font-size: 1em;
  line-height: 1.6;
  text-align: center;
  word-wrap: break-word;
}
.swal2-content small { font-size: .85em; }
.swal2-actions {
  display: flex;
  flex-direction: column;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin: 1.5em auto 0;
}
.swal2-content.swal2-actions { margin-top: 1em; }
.swal2-loader {
  width: 1.6em;
  height: 1.6em;
  margin: 0 auto;
  animation: swal2-rotate-loading 1s linear infinite;
  border: 2px solid color-mix(in srgb, var(--accent) 20%, transparent);
  border-top-color: var(--accent);
  border-radius: 100%;
}
@keyframes swal2-rotate-loading { to { transform: rotate(360deg); } }
.swal2-styled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  margin: .25em;
  padding: 0 1.4em;
  font-family: inherit;
  font-weight: 600;
  font-size: .95em;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: box-shadow .18s, transform .18s;
}
.swal2-styled:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swal2-styled:active { transform: scale(.97); }
.swal2-styled.swal2-confirm {
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: color-mix(in srgb, var(--accent) 12%, #000);
}
.swal2-styled.swal2-confirm:hover {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), 0 8px 24px -8px var(--accent);
}
.swal2-styled.swal2-cancel {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text);
}
.lobby-logo {
  display: block;
  max-width: 50%;
  max-height: 44px;
  margin: 0 auto 1.25em;
}
.powered-by {
  position: absolute;
  left: 50%;
  bottom: -14px;
  transform: translate(-50%, 100%);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.powered-by a { color: var(--muted); }
.powered-by a:hover { color: var(--text); }
</style>
{{if .CustomCSS}}<style>{{.CustomCSS}}</style>{{end}}

</head>
<body>
  <noscript>
    <strong>We're sorry but {{.AppName}} doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>

  <div class="swal2-popup">
    {{if .Logo}}<img class="lobby-logo" src="{{.Logo}}" alt="{{.AppName}}">{{end}}
    {{.Body}}
    {{if .PoweredBy}}<small class="powered-by">Powered by <a href="https://github.com/m1k1o/neko-rooms">neko-rooms</a></small>{{end}}
  </div>

</body>

</html>
