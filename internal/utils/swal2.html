<html>
<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{.Title}}</title>
{{if .Favicon}}<link rel="icon" href="{{.Favicon}}">{{end}}
{{if .FontURL}}<link rel="stylesheet" href="{{.FontURL}}">{{end}}

<style>
:root {
  --bg: {{.BackgroundColor}};
  --popup: {{.PopupColor}};
  --text: {{.TextColor}};
  --accent: {{.ButtonColor}};
  --line: color-mix(in srgb, var(--text) 7%, transparent);
  --line-strong: color-mix(in srgb, var(--text) 15%, transparent);
  --muted: color-mix(in srgb, var(--text) 62%, var(--bg));
  --subtle: color-mix(in srgb, var(--text) 55%, var(--bg));
  --mono: 'Geist Mono', 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: {{.FontFamily}};
  color: var(--text);
  background-color: var(--bg);
  {{if .BackgroundImage}}background-image: url("{{.BackgroundImage}}");
  background-size: cover;
  background-position: center;{{end}}
  display: flex;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.swal2-popup {
  display: flex;
  position: relative;
  z-index: 1;
  flex-direction: column;
  justify-content: center;
  width: 380px;
  max-width: 100%;
  padding: 32px 24px 24px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--popup);
  font-size: 14px;
  animation: rise .4s var(--ease) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.swal2-header {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.swal2-icon {
  display: flex;
  position: relative;
  box-sizing: content-box;
  justify-content: center;
  align-items: center;
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: color-mix(in srgb, var(--text) 3%, var(--popup));
  font-family: inherit;
  cursor: default;
  user-select: none;
}
.swal2-icon.swal2-error { color: #ef4444; }
.swal2-icon.swal2-warning { color: #f59e0b; }
.swal2-icon.swal2-info { color: var(--muted); }
.swal2-icon.swal2-question { color: var(--muted); }
.swal2-icon .swal2-icon-content {
  display: flex;
  align-items: center;
  font-size: 1.35em;
  font-weight: 600;
}

/* success: a calm check mark instead of the animated sweetalert one */
.swal2-icon.swal2-success { color: #10b981; }
.swal2-icon.swal2-success [class^=swal2-success-circular-line],
.swal2-icon.swal2-success .swal2-success-fix,
.swal2-icon.swal2-success .swal2-success-ring { display: none; }
.swal2-icon.swal2-success [class^=swal2-success-line] {
  display: block;
  position: absolute;
  height: 2px;
  border-radius: 2px;
  background-color: currentColor;
}
.swal2-icon.swal2-success [class^=swal2-success-line][class$=tip] {
  top: 1.85em;
  left: .95em;
  width: .7em;
  transform: rotate(45deg);
}
.swal2-icon.swal2-success [class^=swal2-success-line][class$=long] {
  top: 1.6em;
  right: .8em;
  width: 1.3em;
  transform: rotate(-45deg);
}
.swal2-title {
  margin: 0 0 8px;
  padding: 0;
  color: var(--text);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.025em;
  text-align: center;
  word-wrap: break-word;
}
.swal2-content {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  text-align: center;
  word-wrap: break-word;
}
.swal2-content small { font: 400 11.5px var(--mono); color: var(--subtle); letter-spacing: .02em; }
.swal2-actions {
  display: flex;
  flex-direction: column;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin: 1.5em auto 0;
}
.swal2-content.swal2-actions { margin-top: 1em; }
.swal2-loader {
  width: 18px;
  height: 18px;
  margin: 0 auto;
  animation: swal2-rotate-loading .9s linear infinite;
  border: 2px solid var(--line-strong);
  border-top-color: var(--text);
  border-radius: 100%;
}
@keyframes swal2-rotate-loading { to { transform: rotate(360deg); } }
.swal2-styled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 38px;
  margin: 4px;
  padding: 0 16px;
  font-family: inherit;
  font-weight: 500;
  font-size: 13.5px;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: filter 150ms var(--ease), transform 150ms var(--ease), border-color 150ms var(--ease);
}
.swal2-styled:focus-visible { outline: 2px solid var(--line-strong); outline-offset: 2px; }
.swal2-styled:active { transform: scale(.985); }
.swal2-styled.swal2-confirm {
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: color-mix(in srgb, var(--accent) 12%, #000);
}
.swal2-styled.swal2-confirm:hover { filter: brightness(1.06); }
.swal2-styled.swal2-cancel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--text) 3%, var(--popup));
  color: var(--text);
}
.swal2-styled.swal2-cancel:hover { border-color: var(--line-strong); }
.lobby-logo {
  display: block;
  max-width: 50%;
  max-height: 44px;
  margin: 0 auto 1.25em;
}
.powered-by {
  position: absolute;
  left: 50%;
  bottom: -14px;
  transform: translate(-50%, 100%);
  color: var(--subtle);
  font: 400 11.5px var(--mono);
  white-space: nowrap;
}
.powered-by a { color: var(--muted); }
.powered-by a:hover { color: var(--text); }
</style>
{{if .CustomCSS}}<style>{{.CustomCSS}}</style>{{end}}

</head>
<body>
  <noscript>
    <strong>We're sorry but {{.AppName}} doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>

  <div class="swal2-popup">
    {{if .Logo}}<img class="lobby-logo" src="{{.Logo}}" alt="{{.AppName}}">{{end}}
    {{.Body}}
    {{if .PoweredBy}}<small class="powered-by">Powered by <a href="https://github.com/m1k1o/neko-rooms">neko-rooms</a></small>{{end}}
  </div>

</body>

</html>
