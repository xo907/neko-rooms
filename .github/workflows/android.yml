name: Android app

on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # a fixed key lets new versions install over old ones, without it the
      # build is signed with a throwaway debug key
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk WatchParty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchParty-${{ env.VERSION_NAME }}
          path: WatchParty.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: WatchParty ${{ env.VERSION_NAME }}
          files: WatchParty.apk
          prerelease: ${{ startsWith(github.ref, 'refs/tags/android-v0.') }}
          body: |
            WatchParty for Android, version ${{ env.VERSION_NAME }}.

            Download `WatchParty.apk` below on your phone and open it to install
            (allow installing apps from your browser if Android asks).
