name: Test Server

on:
  pull_request:
    branches:
      - master
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - internal/**
      - .github/workflows/server_test.yml
  workflow_call:

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
