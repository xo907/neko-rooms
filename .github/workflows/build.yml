name: "CI for builds"

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-server:
    name: Test Server
    uses: ./.github/workflows/server_test.yml

  build-client:
    name: Build Client Artifacts
    uses: ./.github/workflows/client_build.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-server, build-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client
          path: client/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # image names must be lowercase
      - name: Image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          images="ghcr.io/${repo}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME,,}/${repo#*/}"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "dockerhub=$([ -n "$DOCKERHUB_USERNAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      # optional, only when DOCKERHUB_USERNAME and DOCKER_TOKEN secrets are set
      - name: Log in to Docker Hub
        if: steps.names.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove client stage from Dockerfile
        # Change dockerfile: remove first stage - everything between # STAGE 1 and # STAGE 2
        # Replace "--from=frontend /src/dist/" with "./client/dist/"
        run: |
          sed -i '/# STAGE 1/,/# STAGE 2/d' ./Dockerfile
          sed -i 's/--from=frontend \/src\/dist\//.\/client\/dist\//g' ./Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max
